# FarmView — ambiente Docker
# 1) cp .env.example .env   (e ajuste as senhas e o RASPBERRY_*)
# 2) docker compose up -d --build
# phpMyAdmin (opcional, só em localhost): docker compose --profile ferramentas up -d

services:
  # Banco de dados MySQL
  db:
    image: mysql:8.0
    container_name: farmview-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Defina DB_ROOT_PASS no .env}
      MYSQL_DATABASE: ${DB_NAME:-CEBIOHUB}
      # Usuário da aplicação, com acesso apenas ao banco do FarmView.
      MYSQL_USER: ${DB_USER:-farmview}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
      # Na primeira inicialização: db/schema.sql e db/seed.sql (admin inicial).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - database

  # Aplicação web PHP
  app:
    build: .
    container_name: farmview-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      # Código montado para desenvolvimento (vendor/ é instalado pelo entrypoint).
      - .:/var/www/html
      # Dados persistentes
      - uploads:/var/www/html/Public/uploadImages
      - imagens_experimentos:/var/www/html/Public/templates/Images
      - videos:/var/www/html/storage/videos
    networks:
      - web
      - database

  # Proxy reverso: único serviço exposto ao usuário
  nginx:
    image: nginx:1.27-alpine
    container_name: farmview-nginx
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - web

  # Interface do banco — somente sob demanda e acessível apenas pela própria máquina
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: farmview-phpmyadmin
    profiles: [ "ferramentas" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    networks:
      - database
      - web
    ports:
      - "127.0.0.1:8081:80"

networks:
  web:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  db_data:
  uploads:
  imagens_experimentos:
  videos:
